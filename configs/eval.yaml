# Evaluation setup for the bundled Nimbus Robotics benchmark.
#   rag eval run -c configs/eval.yaml --ingest-corpus
# Only the differences from the built-in defaults are listed.

vector_store:
  collection: nimbus-benchmark      # keep benchmark vectors apart from your own documents

ingestion:
  json:
    jq_schema: ".faq[]"             # one document per FAQ entry

evaluation:
  dataset: ./evals/benchmark/qa.jsonl
  corpus: ./evals/benchmark/corpus
  metrics:
    - hit_rate
    - mrr
    - ndcg
    - evidence_recall
    - filter_compliance
    - token_f1
    - keyword_coverage
    - citation_precision
    - refusal_accuracy
    - faithfulness
    - answer_relevance
    - correctness
    - context_recall
  gates:
    - hit_rate>=0.8
    - filter_compliance>=1.0
    - refusal_accuracy>=0.8
    - faithfulness>=0.8
    - unanswerable.refusal_accuracy>=0.8
    - latency_p95<=10

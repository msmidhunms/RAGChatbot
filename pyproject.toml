[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragchatbot"
version = "0.1.0"
description = "Configurable retrieval-augmented generation chatbot built on LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-text-splitters>=0.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.1",
    "langchain-google-genai>=2.0",
    "chromadb>=0.5",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "tiktoken>=0.7",
    "rank-bm25>=0.2",
    "flashrank>=0.2",
    "faiss-cpu>=1.8",
    "pypdf>=4.0",
    "docx2txt>=0.8",
]

[project.scripts]
rag = "rag_chatbot.cli:app"

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
local = ["langchain-ollama>=0.2", "langchain-huggingface>=0.1", "sentence-transformers>=3.0"]
faiss = ["faiss-cpu>=1.8"]
qdrant = ["qdrant-client>=1.10"]
pgvector = ["langchain-postgres>=0.0.12", "psycopg[binary]>=3.1"]
docs = ["docx2txt>=0.8", "pymupdf>=1.24"]
semantic = ["langchain-experimental>=0.3"]
rerank = ["langchain-cohere>=0.3", "flashrank>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
all = ["ragchatbot[openai,anthropic,local,faiss,qdrant,pgvector,docs,semantic,rerank]"]

[tool.setuptools.packages.find]
include = ["rag_chatbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

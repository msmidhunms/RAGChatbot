<h1>Coffee Brewing</h1>
<p>Pour-over brewing uses a paper filter and water at about 94 degrees Celsius for a clean cup.</p>
<h2>Espresso</h2>
<p>Espresso forces hot water through finely ground coffee at around nine bars of pressure.</p>
<ul><li>Use fresh beans</li><li>Grind just before brewing</li></ul>
